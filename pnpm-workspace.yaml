# pnpm v12 workspace & build-script policy
allowBuilds:
  esbuild: true
  workerd: true

# Windows Smart App Control (Code Integrity policy "VerifiedAndReputableDesktop")
# blocks workerd 1.20261117.1 as unsigned/untrusted, so `vite dev` dies with
# "spawn UNKNOWN". Pin a build Windows currently allows. Re-check after upgrades.
overrides:
  workerd: 1.20261119.1
  "@cloudflare/workerd-windows-64": 1.20261119.1
